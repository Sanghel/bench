name: Task
description: Development task
title: '[TASK] '
labels: ['type: task', 'priority: medium']
body:
  - type: markdown
    attributes:
      value: '## Task description'
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be implemented?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List of acceptance criteria that must be met
      value: |
        - [ ] Acceptance criterion 1
        - [ ] Unit tests with coverage >80%
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that this task depends on
  - type: input
    id: estimation
    attributes:
      label: Estimation
      placeholder: 'X horas'
